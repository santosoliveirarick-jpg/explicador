<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explicador de Conceitos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Explicador de Conceitos</h1>
  <p>Escolha um tema e descubra como a IA o explica para públicos diferentes.</p>

  <!-- method="post" envia os dados para a rota / do Flask. -->
  <form method="post">
    <label for="tema">O que você quer aprender?</label><br>
    <input
      id="tema"
      name="tema"
      type="text"
      value="{{ tema }}"
      placeholder="Ex.: fotossíntese"
      required
    >

    <br><br>

    <label for="nivel">Nível da explicação:</label><br>
    <select id="nivel" name="nivel">
      <option value="criança" {% if nivel == "criança" %}selected{% endif %}>Criança</option>
      <option value="adolescente" {% if nivel == "adolescente" %}selected{% endif %}>Adolescente</option>
      <option value="adulto" {% if nivel == "adulto" %}selected{% endif %}>Adulto</option>
    </select>

    <br><br>

    <button type="submit">Explicar</button>
  </form>

  {% if erro %}
    <p class="erro"><strong>Erro:</strong> {{ erro }}</p>
  {% endif %}

  {% if explicacao %}
    <section class="resposta">
      <h2>{{ tema }}</h2>
      <!-- white-space preserva as quebras de linha sem inserir HTML da IA. -->
      <p class="texto-resposta">{{ explicacao }}</p>
      <p class="aviso"><small>Resposta gerada por IA. Confirme informações importantes em fontes confiáveis.</small></p>
    </section>
  {% endif %}
</body>
</html>
